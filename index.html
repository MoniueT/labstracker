   portable object. This is intentionally storage-agnostic:

   unavailable in this environment), but the same shape would
   drop straight into a database or localStorage elsewhere.

const SESSION_APP = "graves-tracker";

/* A meal plan holds full food objects; we save only the option NAMES plus the
   chosen index, then rebuild from FOOD_BY_NAME on load. Small and durable. */
function compactPlan(plan) {
  return (plan || []).map(d => {
    const row = {
      day: d.day
    };
    MEAL_SLOTS.forEach(s => {
      row[s] = {
        options: (d[s].options || []).map(o => o.name),
        chosen: d[s].chosen || 0
      };
    });
    return row;
  });
}
function rehydratePlan(compact) {
  if (!Array.isArray(compact)) return null;
  return compact.map(d => {
    const row = {
      day: d.day
    };
    MEAL_SLOTS.forEach(s => {
      const src = d[s] || {
        options: [],
        chosen: 0
      };
      const options = (src.options || []).map(n => FOOD_BY_NAME[n]).filter(Boolean);
      row[s] = {
        options,
        chosen: Math.min(src.chosen || 0, Math.max(0, options.length - 1))

    });

  });
}

/* Returns { ok, error }, validates enough to fail safely on a wrong file. */
function parseSession(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    return {
      ok: false,
      error: "That doesn't look like a saved file, it couldn't be read."
    };
  }
  if (!data || data._app !== SESSION_APP) {
    return {
      ok: false,
      error: "That file isn't a saved session from this app."
    };
  }
  return {
    ok: true,
    data
  };
}

/* ---------------------------------------------------------
   Meal-plan generation with taste learning + filters
--------------------------------------------------------- */
function filterPool(pool, filters) {
  return pool.filter(f => {
    if (filters.vegetarian && !f.veg) return false;
    return !f.allergens.some(a => filters.allergens.includes(a));
  });
}

/* Weighted pick, the more a food has been chosen, the likelier it reappears. */
function weightedPick(pool, prefs) {
  const weights = pool.map(f => 1 + (prefs[f.name] || 0) * 2);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function pickOptions(pool, prefs, count) {
  const chosen = [];
  let remaining = [...pool];
  while (chosen.length < count && remaining.length) {
    const pick = weightedPick(remaining, prefs);
    chosen.push(pick);
    remaining = remaining.filter(f => f.name !== pick.name);
  }
  return chosen;
}

/* Like pickOptions, but avoids dishes already used elsewhere in the week (per
   slot). Falls back gracefully, if the filtered pool is too small to fill the
   week without repeats, it resets and allows reuse rather than running dry. */
function pickOptionsExcluding(pool, prefs, count, used) {
  let remaining = pool.filter(f => !used.has(f.name));
  if (remaining.length < count) {
    used.clear();
    remaining = [...pool];
  }
  const chosen = [];
  while (chosen.length < count && remaining.length) {
    const pick = weightedPick(remaining, prefs);
    chosen.push(pick);
    remaining = remaining.filter(f => f.name !== pick.name);
  }
  chosen.forEach(f => used.add(f.name));
  return chosen;
}
function buildMealPlan(filters, prefs) {
  const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  const pools = {};
  const used = {};
  MEAL_SLOTS.forEach(s => {
    pools[s] = filterPool(FOODS[s], filters);
    used[s] = new Set();
  });
  const slot = cat => ({
    options: pickOptionsExcluding(pools[cat], prefs, 2, used[cat]),
    chosen: 0
  });
  return days.map(day => ({
    day,
    breakfast: slot("breakfast"),
    lunch: slot("lunch"),
    dinner: slot("dinner"),
    snack: slot("snack")
  }));
}
function chosenFood(slot) {
  return slot.options.length ? slot.options[slot.chosen] : null;
}
function dayKcal(day) {
  return MEAL_SLOTS.reduce((sum, s) => {
    const f = chosenFood(day[s]);
    return sum + (f ? f.kcal : 0);

      totals.protein += n.protein || 0;

        .lab-term p { margin: 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; }
        .lab-explainer-note { margin: 10px 0 0; padding: 10px 12px; background: var(--primary-soft); border-radius: 9px; font-size: 12px; color: var(--ink); line-height: 1.5; }

        .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--sage-soft); color: var(--sage); font-weight: 600; margin-right: 6px; }
        .pill-quick { background: var(--primary-soft); color: var(--primary); }
        .pill-cycle { background: #F8E9C4; color: var(--gold); }
        .cycle-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
        .cycle-today { font-family: 'Fraunces', serif; font-size: 20px; margin: 2px 0 10px; }

        .guidance-card { border-left: 3px solid var(--ember); padding-left: 14px; margin-bottom: 18px; }
        .guidance-card h3 { font-size: 16px; margin: 0 0 4px; }
        .guidance-card p { margin: 0; font-size: 14px; color: var(--ink-soft); line-height: 1.55; }
        .tip { padding: 12px 0; border-top: 1px solid var(--border); }
        .tip h4 { font-size: 14px; margin: 0 0 3px; }
        .tip p { margin: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }

        /* --- Diet filters --- */
        .filter-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
        .filter-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
        .filter-head label { margin: 0; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
          border: 1px solid var(--border-strong); background: #fff; color: var(--ink-soft);
          border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
          display: inline-flex; align-items: center; gap: 5px; font-family: 'IBM Plex Sans', sans-serif;
        }
        .chip.on { background: var(--ember); border-color: var(--ember); color: #fff; }
        .chip.veg.on { background: var(--sage); border-color: var(--sage); }
        .goal-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .goal-row .field { margin-bottom: 0; max-width: 200px; }
        .learn-note {
          background: var(--sage-soft); border-radius: 10px; padding: 11px 14px; margin-top: 14px;
          font-size: 12.5px; color: #2C6C5A; line-height: 1.5; display: flex; gap: 8px; align-items: flex-start;
        }

        /* --- Day + meal option cards --- */
        .day-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
        .day-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
        .day-head h4 { margin: 0; font-family: 'Fraunces', serif; font-size: 16px; }
        .day-kcal { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }
        .day-kcal.over { color: var(--ember); }
        .day-kcal.under { color: var(--sage); }
        .slot { padding: 8px 0; border-top: 1px solid var(--border); }
        .slot:first-of-type { border-top: none; }
        .slot-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .meal-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
        .opt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .opt {
          text-align: left; border: 1px solid var(--border-strong); background: #fff; border-radius: 10px;
          padding: 9px 11px; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; color: var(--ink);
          display: flex; flex-direction: column; gap: 4px; position: relative; transition: border-color 0.12s ease;
        }
        .opt:hover { border-color: var(--primary); }
        .opt.on { border-color: var(--primary); background: var(--primary-soft); }
        .opt-name { font-size: 13px; line-height: 1.35; }
        .opt-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .opt-kcal { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
        .opt-check { font-size: 12px; color: var(--primary); font-weight: 700; }
        .opt-empty { font-size: 12.5px; color: var(--ink-soft); padding: 8px 0; }
        .opt.matches { border-color: var(--sage); }
        .opt.matches.on { border-color: var(--primary); }
        .opt-badge {
          font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
          color: var(--sage); display: inline-flex; align-items: center; gap: 3px;
        }
        .btags { display: flex; flex-wrap: wrap; gap: 4px; }
        .btag {
          font-size: 9.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
          background: var(--sage-soft); color: #2C6C5A;
        }

        .btag.iodine.Moderate { background: #F8E9C4; color: var(--gold); }
        .why-line {
          display: flex; gap: 6px; align-items: flex-start; margin-top: 7px;
          font-size: 11.5px; color: var(--ink-soft); line-height: 1.45;
        }
        .why-panel { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
        .why-toggle {
          width: 100%; text-align: left; background: var(--sage-soft); border: none; cursor: pointer;
          padding: 13px 16px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13.5px;
          color: #2C6C5A; display: flex; align-items: center; justify-content: space-between; gap: 8px;

        .why-body { padding: 4px 16px 8px; }

          font-size: 13px; color: var(--ink); background: var(--primary-soft); border-radius: 9px;
          padding: 10px 12px; margin: 12px 0; line-height: 1.5;
        }
        .why-item { padding: 11px 0; border-top: 1px solid var(--border); }
        .why-item:first-of-type { border-top: none; }
        .why-item h5 { margin: 0 0 3px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; }
        .why-item p { margin: 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }

        /* --- Nutrient snapshot --- */
        .snap-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 14px; margin: 4px 0 18px; background: #FBFDFE; }
        .snap-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .snap-head h4 { margin: 0; font-family: 'Fraunces', serif; font-size: 16px; }
        .snap-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 12px; line-height: 1.5; }
        .snap-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); }
        .snap-row:first-of-type { border-top: none; }
        .snap-val { flex-shrink: 0; width: 96px; }
        .snap-num { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; color: var(--ink); }
        .snap-unit { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-left: 2px; }
        .snap-name { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
        .snap-body { flex: 1; }
        .snap-band { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-bottom: 4px; }
        .snap-band.low { background: var(--gold-soft, #F8E9C4); color: #8A6A12; }
        .snap-band.ok { background: var(--sage-soft); color: #2C6C5A; }
        .snap-band.high { background: var(--ember-soft); color: #A2521C; }
        .snap-note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 0; }
        .snap-iodine { font-size: 12.5px; color: var(--ink); background: var(--primary-soft); border-radius: 9px; padding: 10px 12px; margin-top: 12px; line-height: 1.5; }
        .snap-foot { font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; margin: 12px 0 0; }

        /* --- Your pattern (fingerprint + trajectory) --- */
        .pattern-card { border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin: 18px 0 8px; background: linear-gradient(180deg, #FBFDFE 0%, #F6FBFC 100%); }
        .pattern-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .pattern-head h3 { margin: 0; font-family: 'Fraunces', serif; font-size: 17px; }
        .pattern-sub { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 16px; }
        .pattern-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 600; margin: 18px 0 10px; }
        .fp-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
        .fp-name { flex-shrink: 0; width: 116px; font-size: 12px; color: var(--ink); line-height: 1.25; }
        .fp-track { flex: 1; height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; }
        .fp-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
        .fp-val { flex-shrink: 0; width: 58px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
        .fp-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; }
        .fp-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft); }
        .fp-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
        .traj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 560px) { .traj-grid { grid-template-columns: 1fr; } }
        .traj-box { border: 1px solid var(--border); border-radius: 11px; padding: 12px 13px; background: #fff; }
        .traj-box h5 { margin: 0 0 2px; font-size: 12.5px; font-weight: 600; }
        .traj-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin: 0 0 8px; }
        .traj-arrow { font-weight: 600; }
        .traj-arrow.down { color: var(--sage); }
        .traj-arrow.up { color: var(--ember); }
        .traj-arrow.steady { color: var(--ink-soft); }
        .pattern-read { font-size: 13px; color: var(--ink); background: var(--primary-soft); border-radius: 10px; padding: 12px 14px; margin-top: 16px; line-height: 1.55; }
        .pattern-empty { font-size: 13px; color: var(--ink-soft); line-height: 1.55; background: #fff; border: 1px dashed var(--border-strong); border-radius: 11px; padding: 14px 16px; }
        .pattern-foot { font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; margin: 14px 0 0; }
        .radar-wrap { padding: 6px 0 4px; }
        .week-snapshot {
          display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
          background: var(--surface-tint); border: 1px solid var(--border); border-radius: 11px;
          padding: 12px 14px; margin-bottom: 6px; font-size: 13px; color: var(--ink);
        }
        .week-snapshot .ws-num { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; }
        .week-snapshot .ws-arrow { font-size: 12px; font-weight: 600; }
        .week-snapshot .ws-arrow.down { color: var(--sage); }
        .week-snapshot .ws-arrow.up { color: var(--ember); }
        .week-snapshot .ws-arrow.steady { color: var(--ink-soft); }
        .heatmap-wrap { padding: 2px 0; }
        .heatmap-legend { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 10.5px; color: var(--ink-soft); }
        .heatmap-legend .hm-key { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

        /* --- Dashboard visuals --- */
        .dash-viz { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 16px; }
        @media (min-width: 560px) { .dash-viz { grid-template-columns: 240px 1fr; align-items: center; } }
        .dash-viz-radar, .dash-viz-heat { background: var(--surface-tint); border: 1px solid var(--border); border-radius: 13px; padding: 14px; }
        .dash-viz-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 600; margin-bottom: 10px; }

        /* --- Shopping list --- */
        .shop-group { margin-bottom: 16px; }
        .shop-group h4 { font-family: 'Fraunces', serif; font-size: 14px; margin: 0 0 8px; color: var(--primary); }
        .shop-item {
          display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border);
          font-size: 13.5px; cursor: pointer; user-select: none;
        }
        .shop-item:last-child { border-bottom: none; }
        .shop-box {
          width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong);
          flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px;
        }
        .shop-item.done .shop-box { background: var(--sage); border-color: var(--sage); }
        .shop-item.done .shop-name { text-decoration: line-through; color: var(--ink-soft); }
        .shop-name { flex: 1; }
        .shop-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
        .shop-empty { color: var(--ink-soft); font-size: 14px; }

        .welcome-hero {
          text-align: left; padding: 34px 30px 30px; color: #fff; border: none;
          background:
            radial-gradient(600px 300px at 88% -20%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 60%),
            var(--sky-grad);
          box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
        }
        .welcome-hero::after {
          content: ""; position: absolute; right: -60px; bottom: -80px; width: 260px; height: 260px;
          background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 70%);
        }
        .welcome-hero .eyebrow { color: rgba(255,255,255,0.92); }
        .welcome-hero h1 { font-size: 36px; line-height: 1.1; margin: 12px 0 14px; color: #fff; }
        .welcome-hero .lede { color: rgba(255,255,255,0.94); font-size: 15.5px; }
        .welcome-hero .disclaimer {
          background: rgba(255,255,255,0.16); color: rgba(255,255,255,0.95); backdrop-filter: blur(2px);
        }
        .welcome-hero .btn-hero {
          background: #fff; color: var(--primary-deep); box-shadow: 0 8px 20px rgba(6, 50, 78, 0.24);
        }
        .welcome-hero .btn-hero-ghost {
          background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.55);
        }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .hero-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
        .hero-chip {
          font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 999px;
          background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.35);
        }

        /* --- Welcome-back dashboard --- */
        .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 4px; }
        @media (min-width: 520px) { .dash-grid { grid-template-columns: repeat(4, 1fr); } }
        .dash-tile { background: var(--surface-tint); border: 1px solid var(--border); border-radius: 13px; padding: 14px; }
        .dash-tile .dt-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 600; }
        .dash-tile .dt-value { font-family: 'Fraunces', serif; font-size: 24px; line-height: 1.1; margin-top: 6px; color: var(--ink); }
        .dash-tile .dt-sub { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
        .dt-arrow.down { color: var(--sage); }
        .dt-arrow.up { color: var(--ember); }
        .dt-arrow.steady { color: var(--ink-soft); }
        .dash-quick { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        .wing-row { display: flex; gap: 6px; margin-bottom: 4px; }
        .wing-row svg path { stroke: rgba(255,255,255,0.95) !important; fill: rgba(255,255,255,0.95) !important; }
        .wing-row svg circle { fill: #fff !important; }

        .insight-row { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
        .insight-row:last-child { border-bottom: none; }
        .insight-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
        .insight-dot.flag { background: var(--ember); }
        .insight-dot.info { background: var(--gold); }
        .insight-dot.good { background: var(--sage); }
        .insight-row p { margin: 0; font-size: 14px; line-height: 1.5; }

        .food-table { margin-top: 10px; }
        .food-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .food-row:last-child { border-bottom: none; }
        .food-name { flex: 1; font-size: 13.5px; }
        .food-note { font-size: 12px; color: var(--ink-soft); flex-basis: 100%; margin-top: -4px; }
        .tag-io { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
        .tag-io.High { background: var(--ember-soft); color: var(--ember); }
        .tag-io.Moderate { background: #F8E9C4; color: var(--gold); }
        .tag-io.Low { background: var(--sage-soft); color: var(--sage); }
        .tag-goitro { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
        .search-wrap { position: relative; }
        .search-wrap .icon-wrap { position: absolute; left: 12px; top: 11px; color: var(--ink-soft); }
        .search-wrap input { padding-left: 34px; }

        .med-item { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
        .med-item:last-child { border-bottom: none; }
        .safety-note {
          display: flex; gap: 11px; align-items: flex-start; margin-top: 18px;
          padding: 13px 15px; border-radius: 11px;
          background: var(--ember-soft); border: 1px solid #F1CDAF;
          font-size: 12.5px; line-height: 1.55; color: #7A3B18;
        }
        .safety-note strong { color: #6A3212; }
        .safety-icon { font-size: 16px; line-height: 1.2; flex-shrink: 0; }

        .summary-box textarea { min-height: 260px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; }
        .summary-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

        /* --- Printable appointment card --- */
        .appt-card { border: 1px solid var(--border-strong); border-radius: 14px; padding: 20px 22px; margin: 6px 0 20px; background: #fff; }
        .appt-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 2px solid var(--primary); }
        .appt-head .appt-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--sky-grad); display: flex; align-items: center; justify-content: center; }
        .appt-head .appt-mark svg path { stroke: #fff !important; fill: #fff !important; }
        .appt-head .appt-mark svg circle { fill: #fff !important; }
        .appt-head .appt-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; }
        .appt-head .appt-date { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }

        .appt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
        @media (max-width: 520px) { .appt-grid { grid-template-columns: 1fr; } }
        .appt-block { margin-top: 12px; }
        .appt-block h4 { margin: 0 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary-deep); font-weight: 700; }
        .appt-block p { margin: 0 0 4px; font-size: 13px; color: var(--ink); line-height: 1.5; }
        .appt-block p.muted { color: var(--ink-soft); }
        .appt-q { margin: 4px 0 0; padding-left: 18px; }
        .appt-q li { font-size: 13px; color: var(--ink); line-height: 1.5; margin-bottom: 3px; }
        .appt-foot { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--ink-soft); }

        /* --- Questions checklist --- */
        .questions-edit { margin-top: 8px; }
        .q-item {
          display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
          padding: 11px 13px; margin-bottom: 8px; border-radius: 10px; cursor: pointer;
          border: 1px solid var(--border-strong); background: #fff; font-family: 'IBM Plex Sans', sans-serif;
          font-size: 13px; color: var(--ink); line-height: 1.45; transition: all 0.15s ease;
        }
        .q-item:hover { border-color: var(--primary); }
        .q-item.on { background: var(--primary-soft); border-color: var(--primary); }
        .q-check { flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--primary-deep); font-weight: 700; margin-top: 1px; }
        .q-item.on .q-check { background: var(--primary); border-color: var(--primary); color: #fff; }
        .q-remove { margin-left: auto; font-size: 11px; color: var(--ink-soft); text-decoration: underline; flex-shrink: 0; }
        .q-add { display: flex; gap: 8px; margin-top: 4px; }
        .q-add input { flex: 1; }

        .chart-legend { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
        .chart-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
